services:
  - type: web
    name: south-bay-planning-ai
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      # Free key from https://console.groq.com/keys - powers "Ask a Question" and meeting summaries.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      # How much the model reasons before answering - low/medium/high. Higher is slower and uses
      # more of the free plan's per-minute budget; omit to default to low.
      - key: LLM_REASONING_EFFORT
        sync: false
      # Free key from https://tavily.com - lets "Summarize recent meetings" fall back to a web
      # search for the cities with no Legistar feed configured (Milpitas among them). Without this,
      # those cities just say so instead of summarizing.
      - key: TAVILY_API_KEY
        sync: false
      # Postgres connection string. Required for full accounts and email digests. Device-only guest profiles still work without it.
      - key: DATABASE_URL
        sync: false
      # Resend API key. Without this no digest email can be sent.
      - key: RESEND_API_KEY
        sync: false
      # Verified sender. The onboarding@resend.dev default only delivers to your own Resend account
      # address - set this to an address on a domain you've verified in Resend before going live.
      - key: RESEND_FROM
        sync: false
      # Shared secret the scheduler must present. Generate a long random string.
      - key: CRON_SECRET
        sync: false
      # Whoever may see how many people use the site: a comma-separated list of account usernames.
      # Their account page shows the total; everyone else's request for it 404s.
      - key: ADMIN_USERNAMES
        sync: false
      # Public site origin, used to build the links inside the emails. No trailing slash.
      - key: SITE_URL
        value: https://southbaydashboard.com
