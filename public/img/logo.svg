<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="The Bay Dashboard">
  <title>The Bay Dashboard</title>
  <!-- A folded paper map: rounded tile, a road grid printed on it, a dog-eared corner, a location
       pin marking a spot on it, and BAY set across the middle so the mark reads at a glance. -->
  <rect width="32" height="32" rx="6" fill="#2E3B1C"/>
  <!-- streets -->
  <g stroke="#4A5C30" stroke-width="1" opacity="0.9">
    <path d="M0 10.5H32"/>
    <path d="M0 22H32"/>
    <path d="M9.5 0V32"/>
    <path d="M22 0V32"/>
  </g>
  <g stroke="#3E4F24" stroke-width="0.6" opacity="0.7">
    <path d="M0 16H32"/>
    <path d="M15.5 0V32"/>
  </g>
  <!-- the sheet's folded corner -->
  <path d="M25 0H32V7L25 0Z" fill="#24301660"/>
  <path d="M25 0L32 7" stroke="#4A5C30" stroke-width="0.6"/>
  <!-- BAY, set across the map -->
  <text x="16" y="20.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="12.5" letter-spacing="0.3" fill="#F5F3E7">BAY</text>
  <!-- a pin marking a place on the map -->
  <path d="M6.3 25.2c0-1.7 1.4-3 3.1-3s3.1 1.3 3.1 3c0 2.2-3.1 5.3-3.1 5.3s-3.1-3.1-3.1-5.3Z" fill="#F0C86A"/>
  <circle cx="9.4" cy="25.1" r="1.15" fill="#2E3B1C"/>
</svg>
